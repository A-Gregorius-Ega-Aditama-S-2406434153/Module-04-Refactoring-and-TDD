<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order List</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container mt-4">
    <h3>Order List</h3>
    <div class="mb-3">
        <a th:href="@{/order/create}" class="btn btn-primary btn-sm">Create Order</a>
        <a th:href="@{/order/history}" class="btn btn-outline-secondary btn-sm ml-2">Search Again</a>
    </div>

    <div th:if="${author != null}" class="alert alert-info p-2">
        Showing orders for <strong th:text="${author}"></strong>
    </div>

    <table class="table table-striped table-responsive-md">
        <thead>
        <tr>
            <th scope="col">Order ID</th>
            <th scope="col">Author</th>
            <th scope="col">Status</th>
            <th scope="col">Order Time</th>
            <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.author}"></td>
            <td th:text="${order.status}"></td>
            <td th:text="${order.orderTime}"></td>
            <td>
                <a th:href="@{/order/pay/{id}(id=${order.id})}" class="btn btn-outline-primary btn-sm">Pay</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
