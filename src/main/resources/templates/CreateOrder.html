<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container mt-4">
    <h3>Create Order</h3>

    <form th:action="@{/order/create}" method="post">
        <div class="form-group">
            <label for="authorInput">Author</label>
            <input id="authorInput" name="author" type="text" class="form-control col-4"
                   placeholder="Enter author name" required>
        </div>
        <div class="form-group">
            <label for="productNameInput">Product Name</label>
            <input id="productNameInput" name="productName" type="text" class="form-control col-4"
                   placeholder="Enter product name" required>
        </div>
        <div class="form-group">
            <label for="productQuantityInput">Product Quantity</label>
            <input id="productQuantityInput" name="productQuantity" type="number" class="form-control col-4"
                   min="1" required>
        </div>
        <button type="submit" class="btn btn-primary">Create</button>
        <a th:href="@{/order/history}" class="btn btn-outline-secondary ml-2">View History</a>
    </form>
</div>
</body>
</html>
