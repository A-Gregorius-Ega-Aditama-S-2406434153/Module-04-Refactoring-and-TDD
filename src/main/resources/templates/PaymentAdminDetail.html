<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Admin Detail</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container mt-4">
    <h3>Payment Admin Detail</h3>

    <table class="table table-bordered col-8">
        <tr>
            <th>Payment ID</th>
            <td th:text="${payment.id}"></td>
        </tr>
        <tr>
            <th>Order ID</th>
            <td th:text="${payment.order.id}"></td>
        </tr>
        <tr>
            <th>Method</th>
            <td th:text="${payment.method}"></td>
        </tr>
        <tr>
            <th>Status</th>
            <td th:text="${payment.status}"></td>
        </tr>
    </table>

    <form th:action="@{/payment/admin/set-status/{id}(id=${payment.id})}" method="post" class="d-inline">
        <input type="hidden" name="status" th:value="${successStatus}">
        <button type="submit" class="btn btn-success">Set SUCCESS</button>
    </form>

    <form th:action="@{/payment/admin/set-status/{id}(id=${payment.id})}" method="post" class="d-inline ml-2">
        <input type="hidden" name="status" th:value="${rejectedStatus}">
        <button type="submit" class="btn btn-danger">Set REJECTED</button>
    </form>

    <div class="mt-3">
        <a th:href="@{/payment/admin/list}" class="btn btn-outline-secondary">Back to Admin List</a>
    </div>
</div>
</body>
</html>
