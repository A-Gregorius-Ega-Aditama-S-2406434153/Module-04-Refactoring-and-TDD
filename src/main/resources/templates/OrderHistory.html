<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order History</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container mt-4">
    <h3>Find Order History</h3>

    <form th:action="@{/order/history}" method="post">
        <div class="form-group">
            <label for="authorInput">Author</label>
            <input id="authorInput" name="author" type="text" class="form-control col-4"
                   placeholder="Enter author name" required>
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
        <a th:href="@{/order/create}" class="btn btn-outline-secondary ml-2">Create Order</a>
    </form>
</div>
</body>
</html>
